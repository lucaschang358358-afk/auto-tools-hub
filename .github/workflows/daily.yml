name: Deploy Custom Tool

on:
  workflow_dispatch:
    inputs:
      tool_topic:
        description: '請輸入這次要做的小工具主題（例如：記帳工具、番茄鐘、睡眠計算器）：'
        required: true
        default: 'Personal Expense Tracker'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-genai

      - name: Generate Custom Tool
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.AI_API_KEY }}
          CUSTOM_TOPIC: ${{ github.event.inputs.tool_topic }}
        run: python generate.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add .
          git commit -m "Generated tool: ${{ github.event.inputs.tool_topic }}" || exit 0
          git push
