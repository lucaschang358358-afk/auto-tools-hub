name: Auto Deploy Tool (Twice Daily)

on:
  schedule:
    # Runs twice daily at UTC 22:00 and UTC 10:00 (09:00 AM & 21:00 PM AEST/AEDT)
    - cron: '0 10,22 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-generativeai

      - name: Generate New Tool
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.AI_API_KEY }}
        run: python generate.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add .
          git commit -m "Auto generated new tool: $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push
