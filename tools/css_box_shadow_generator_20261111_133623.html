<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Shadow Generator - Visual CSS Shadow Tool</title>
    <meta name="description" content="Free online CSS box shadow generator. Visually adjust offsets, blur, spread, colors, and generate production-ready CSS code instantly.">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .preview-section {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 380px;
        }

        .preview-box-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 40px;
            background: radial-gradient(circle, #334155 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .preview-box {
            width: 160px;
            height: 160px;
            background-color: #38bdf8;
            border-radius: 12px;
            transition: box-shadow 0.1s ease;
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .control-header span:last-child {
            color: var(--text-color);
            font-family: monospace;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .color-row {
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="color"] {
            appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid var(--border);
            border-radius: 50%;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .output-card {
            margin-top: 24px;
            grid-column: 1 / -1;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .output-header h3 {
            font-size: 1rem;
            font-weight: 600;
        }

        pre {
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            font-family: 'Fira Code', monospace, monospace;
            font-size: 0.9rem;
            color: #38bdf8;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>CSS Box Shadow Generator</h1>
            <p>Fine-tune shadow parameters and copy ready-to-use CSS instantly.</p>
        </header>

        <div class="workspace">
            <!-- Controls Panel -->
            <div class="card controls-section">
                <div class="control-group">
                    <div class="control-header">
                        <label for="offsetX">Horizontal Offset</label>
                        <span id="valOffsetX">0px</span>
                    </div>
                    <input type="range" id="offsetX" min="-50" max="50" value="0">
                </div>

                <div class="control-group">
                    <div class="control-header">
                        <label for="offsetY">Vertical Offset</label>
                        <span id="valOffsetY">10px</span>
                    </div>
                    <input type="range" id="offsetY" min="-50" max="50" value="10">
                </div>

                <div class="control-group">
                    <div class="control-header">
                        <label for="blur">Blur Radius</label>
                        <span id="valBlur">25px</span>
                    </div>
                    <input type="range" id="blur" min="0" max="100" value="25">
                </div>

                <div class="control-group">
                    <div class="control-header">
                        <label for="spread">Spread Radius</label>
                        <span id="valSpread">-3px</span>
                    </div>
                    <input type="range" id="spread" min="-50" max="50" value="-3">
                </div>

                <div class="color-row">
                    <div class="color-picker-wrapper">
                        <input type="color" id="shadowColor" value="#000000">
                        <label for="shadowColor" style="font-size:0.9rem; color:var(--text-muted); cursor:pointer;">Shadow Color</label>
                    </div>
                    <div class="control-group" style="flex-grow:1; max-width:180px;">
                        <div class="control-header">
                            <label for="opacity">Opacity</label>
                            <span id="valOpacity">0.1</span>
                        </div>
                        <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.1">
                    </div>
                </div>

                <div class="checkbox-wrapper">
                    <input type="checkbox" id="inset">
                    <label for="inset">Inset Shadow (Inner Shadow)</label>
                </div>
            </div>

            <!-- Preview Panel -->
            <div class="card preview-section">
                <div class="preview-box-container">
                    <div class="preview-box" id="previewBox"></div>
                </div>
                <div style="font-size: 0.85rem; color: var(--text-muted); text-align: center;">
                    Real-time visual preview rendered using native CSS properties.
                </div>
            </div>

            <!-- Output Panel -->
            <div class="card output-card">
                <div class="output-header">
                    <h3>Generated CSS Code</h3>
                    <button class="btn" id="copyBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        Copy CSS
                    </button>
                </div>
                <pre id="cssOutput">box-shadow: 0px 10px 25px -3px rgba(0, 0, 0, 0.10);</pre>
            </div>
        </div>

        <div style="text-align:center;margin-top:24px;font-size:12px;color:#888;">Free tool. Support via <a href="https://paypal.me/your_paypal_username" target="_blank" style="color:#38bdf8;">PayPal</a></div>
    </div>

    <script>
        const offsetX = document.getElementById('offsetX');
        const offsetY = document.getElementById('offsetY');
        const blur = document.getElementById('blur');
        const spread = document.getElementById('spread');
        const shadowColor = document.getElementById('shadowColor');
        const opacity = document.getElementById('opacity');
        const inset = document.getElementById('inset');

        const valOffsetX = document.getElementById('valOffsetX');
        const valOffsetY = document.getElementById('valOffsetY');
        const valBlur = document.getElementById('valBlur');
        const valSpread = document.getElementById('valSpread');
        const valOpacity = document.getElementById('valOpacity');

        const previewBox = document.getElementById('previewBox');
        const cssOutput = document.getElementById('cssOutput');
        const copyBtn = document.getElementById('copyBtn');

        function hexToRgba(hex, alpha) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function updateShadow() {
            const hVal = offsetX.value + 'px';
            const vVal = offsetY.value + 'px';
            const bVal = blur.value + 'px';
            const sVal = spread.value + 'px';
            const colorRgba = hexToRgba(shadowColor.value, opacity.value);
            const insetVal = inset.checked ? 'inset ' : '';

            valOffsetX.textContent = hVal;
            valOffsetY.textContent = vVal;
            valBlur.textContent = bVal;
            valSpread.textContent = sVal;
            valOpacity.textContent = parseFloat(opacity.value).toFixed(2);

            const shadowString = `${insetVal}${hVal} ${vVal} ${bVal} ${sVal} ${colorRgba}`;
            
            previewBox.style.boxShadow = shadowString;
            cssOutput.textContent = `box-shadow: ${shadowString};`;
        }

        const inputs = [offsetX, offsetY, blur, spread, shadowColor, opacity, inset];
        inputs.forEach(input => {
            input.addEventListener('input', updateShadow);
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(cssOutput.textContent).then(() => {
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Copied!
                `;
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                }, 2000);
            });
        });

        // Initialize default view
        updateShadow();
    </script>
</body>
</html>
