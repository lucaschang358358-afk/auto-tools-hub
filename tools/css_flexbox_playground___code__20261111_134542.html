<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox Playground & Code Generator</title>
    <meta name="description" content="A free, interactive client-side CSS Flexbox playground and code generator. Easily visually construct flex layouts and copy clean CSS code instantly.">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .main-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel h2 {
            font-size: 1.1rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        select, input[type="number"] {
            background-color: var(--bg-tertiary);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input[type="number"]:focus {
            border-color: var(--accent);
        }

        .workspace {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .preview-container {
            background-color: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            flex: 1;
            min-height: 400px;
            padding: 20px;
            display: flex;
            position: relative;
            overflow: auto;
        }

        /* Dynamic Flexbox Preview Target */
        #flexContainer {
            width: 100%;
            height: 100%;
            min-height: 350px;
            background-color: var(--bg-primary);
            border-radius: var(--radius);
            border: 2px dashed var(--border);
            padding: 12px;
        }

        .flex-item {
            background-color: var(--accent);
            color: var(--bg-primary);
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            min-width: 60px;
            min-height: 60px;
            padding: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            user-select: none;
        }

        .code-output-container {
            background-color: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-header h3 {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        button.copy-btn {
            background-color: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 6px 14px;
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.copy-btn:hover {
            background-color: var(--accent-hover);
        }

        pre {
            background-color: var(--bg-primary);
            padding: 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .actions-row {
            display: flex;
            gap: 10px;
        }

        button.action-btn {
            flex: 1;
            background-color: var(--bg-tertiary);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button.action-btn:hover {
            background-color: var(--border);
        }
    </style>
</head>
<body>

    <header>
        <h1>CSS Flexbox Playground</h1>
        <p>Visually configure flexible layouts and instantly export generated CSS code.</p>
    </header>

    <div class="main-container">
        <!-- Controls Panel -->
        <div class="panel">
            <h2>Container Properties</h2>
            
            <div class="control-group">
                <label for="flexDirection">flex-direction</label>
                <select id="flexDirection" onchange="updateFlex()">
                    <option value="row">row</option>
                    <option value="row-reverse">row-reverse</option>
                    <option value="column">column</option>
                    <option value="column-reverse">column-reverse</option>
                </select>
            </div>

            <div class="control-group">
                <label for="justifyContent">justify-content</label>
                <select id="justifyContent" onchange="updateFlex()">
                    <option value="flex-start">flex-start</option>
                    <option value="flex-end">flex-end</option>
                    <option value="center">center</option>
                    <option value="space-between">space-between</option>
                    <option value="space-around">space-around</option>
                    <option value="space-evenly">space-evenly</option>
                </select>
            </div>

            <div class="control-group">
                <label for="alignItems">align-items</label>
                <select id="alignItems" onchange="updateFlex()">
                    <option value="stretch">stretch</option>
                    <option value="flex-start">flex-start</option>
                    <option value="flex-end">flex-end</option>
                    <option value="center">center</option>
                    <option value="baseline">baseline</option>
                </select>
            </div>

            <div class="control-group">
                <label for="flexWrap">flex-wrap</label>
                <select id="flexWrap" onchange="updateFlex()">
                    <option value="nowrap">nowrap</option>
                    <option value="wrap">wrap</option>
                    <option value="wrap-reverse">wrap-reverse</option>
                </select>
            </div>

            <div class="control-group">
                <label for="alignContent">align-content</label>
                <select id="alignContent" onchange="updateFlex()">
                    <option value="normal">normal</option>
                    <option value="flex-start">flex-start</option>
                    <option value="flex-end">flex-end</option>
                    <option value="center">center</option>
                    <option value="space-between">space-between</option>
                    <option value="space-around">space-around</option>
                    <option value="stretch">stretch</option>
                </select>
            </div>

            <div class="control-group">
                <label for="gapSize">gap (px)</label>
                <input type="number" id="gapSize" value="10" min="0" max="50" oninput="updateFlex()">
            </div>

            <h2>Items Management</h2>
            <div class="actions-row">
                <button class="action-btn" onclick="addItem()">+ Add Item</button>
                <button class="action-btn" onclick="removeItem()">- Remove Item</button>
            </div>
        </div>

        <!-- Workspace & Preview -->
        <div class="workspace">
            <div class="preview-container">
                <div id="flexContainer">
                    <div class="flex-item">1</div>
                    <div class="flex-item">2</div>
                    <div class="flex-item">3</div>
                </div>
            </div>

            <div class="code-output-container">
                <div class="code-header">
                    <h3>Generated CSS</h3>
                    <button class="copy-btn" onclick="copyCode()">Copy Code</button>
                </div>
                <pre id="codeOutput"></pre>
            </div>
        </div>
    </div>

    <div style="text-align:center;margin-top:24px;font-size:12px;color:#888;">Free tool. Support via <a href="https://paypal.me/your_paypal_username" target="_blank" style="color:#38bdf8;">PayPal</a></div>

    <script>
        function updateFlex() {
            const container = document.getElementById('flexContainer');
            
            const flexDirection = document.getElementById('flexDirection').value;
            const justifyContent = document.getElementById('justifyContent').value;
            const alignItems = document.getElementById('alignItems').value;
            const flexWrap = document.getElementById('flexWrap').value;
            const alignContent = document.getElementById('alignContent').value;
            const gapSize = document.getElementById('gapSize').value;

            // Apply styles to visual target
            container.style.display = 'flex';
            container.style.flexDirection = flexDirection;
            container.style.justifyContent = justifyContent;
            container.style.alignItems = alignItems;
            container.style.flexWrap = flexWrap;
            container.style.alignContent = alignContent;
            container.style.gap = gapSize + 'px';

            // Generate output text
            let cssString = `.container {\n`;
            cssString += `  display: flex;\n`;
            cssString += `  flex-direction: ${flexDirection};\n`;
            cssString += `  justify-content: ${justifyContent};\n`;
            cssString += `  align-items: ${alignItems};\n`;
            cssString += `  flex-wrap: ${flexWrap};\n`;
            if (alignContent !== 'normal') {
                cssString += `  align-content: ${alignContent};\n`;
            }
            if (gapSize > 0) {
                cssString += `  gap: ${gapSize}px;\n`;
            }
            cssString += `}`;

            document.getElementById('codeOutput').textContent = cssString;
        }

        function addItem() {
            const container = document.getElementById('flexContainer');
            const itemCount = container.children.length + 1;
            const newItem = document.createElement('div');
            newItem.className = 'flex-item';
            newItem.textContent = itemCount;
            
            // Give custom sizing variation to showcase wrap/alignment effectively
            if(itemCount % 2 === 0) {
                newItem.style.minHeight = '80px';
            }
            
            container.appendChild(newItem);
            updateFlex();
        }

        function removeItem() {
            const container = document.getElementById('flexContainer');
            if (container.children.length > 1) {
                container.removeChild(container.lastElementChild);
                updateFlex();
            }
        }

        function copyCode() {
            const codeText = document.getElementById('codeOutput').textContent;
            navigator.clipboard.writeText(codeText).then(() => {
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 1500);
            });
        }

        // Initial trigger
        updateFlex();
    </script>
</body>
</html>
